# Code Scenario Vscode Workflow Feature Development With Progress Tracking

## Action

Follow the feature-development-with-progress-tracking workflow:
1. Create or update feature implementation files in src/ (e.g., src/extension.ts, src/itemEditorPanel.ts, src/scenarioModel.ts)
2. Update package.json if necessary
