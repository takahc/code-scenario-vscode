# Code Scenario Vscode Workflow Add New Feature Module

## Action

Follow the add-new-feature-module workflow:
1. Create or update TypeScript source files in src/ (e.g., scenarioModel.ts, scenarioProvider.ts, symbolResolver.ts, extension.ts)
2. Add or update package.json with new commands, menus, or contributions
3. Update or add configuration files such as tsconfig.json
4. Add or update resource files (e.g., icons in resources/)
5. Update .gitignore and .vscodeignore as needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/*.ts, package.json, tsconfig.json

